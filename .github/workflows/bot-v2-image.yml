name: Build keeper-bot-v2 image

# Builds the keeper-bot-v2 container image on PRs that touch the bot or SDK,
# and publishes it to GHCR on release tags. The image is built from the
# repository root because the bot depends on the local SDK in packages/sdk-ts.
#
# On PRs: image is built and validated (no push).
# On release tags (v*.*.*): image is built, tagged with the release version and
#   'latest', and pushed to GHCR.
#
# Usage (push to trigger on release):
#   git tag -a v0.2.0 -m "Release v0.2.0"
#   git push origin v0.2.0

on:
  pull_request:
    paths:
      - "examples/keeper-bot-v2/**"
      - "packages/sdk-ts/**"
      - ".github/workflows/bot-v2-image.yml"
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/keeper-bot-v2

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On PRs, build and discard (no push).
      # On release tags, login to GHCR and set up to push.
      - name: Log in to Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Determine image tags and push flag based on event type.
      - name: Compute image tags and push decision
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Release tag: push to GHCR with version tag and latest.
            VERSION=${GITHUB_REF#refs/tags/}
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            PUSH=true
          else
            # PR or manual trigger: build only (no push).
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number || 'manual' }}"
            PUSH=false
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/keeper-bot-v2/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Populate annotations from commit metadata for better
          # transparency in the registry.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}

      - name: Image built successfully
        run: echo "keeper-bot-v2 image built: ${{ steps.meta.outputs.tags }}"
